name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image already has the Android SDK (ANDROID_HOME); Gradle installs the NDK if needed.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
